<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云形成仿真实验 - Cloud Formation Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", system-ui, -apple-system, sans-serif;
        }

        :root {
            --main-color: #4fc3f7;
            --main-light: #81d4fa;
            --cloud-color: #ffffff;
            --text-primary: #f8f9fa;
            --text-secondary: #b8c2cc;
            --panel-bg: rgba(28, 36, 52, 0.75);
            --border-color: rgba(79, 195, 247, 0.4);
            --btn-bg: #26a69a;
            --btn-danger: #ef5350;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #050a18 0%, #0d1629 50%, #081020 100%);
            background-attachment: fixed;
            padding: 24px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1320px;
            height: 90vh;
            display: flex;
            gap: 32px;
            align-items: center;
        }

        .view-box {
            flex: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .sim-cabin {
            width: 560px;
            height: 420px;
            position: relative;
            background: linear-gradient(145deg, #121b2e, #0e1524);
            border-radius: 28px;
            border: 1px solid var(--border-color);
            box-shadow: 
                0 0 25px rgba(79, 195, 247, 0.15),
                0 10px 40px rgba(0, 0, 0, 0.5),
                inset 0 0 60px rgba(79, 195, 247, 0.08),
                inset 0 0 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            overflow: hidden;
        }

        .legend {
            display: flex;
            gap: 48px;
            padding: 16px 32px;
            background: var(--panel-bg);
            border-radius: 18px;
            border: 1px solid var(--border-color);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
        }
        .water {
            width: 8px;
            height: 8px;
            background: var(--main-color);
            box-shadow: 0 0 12px rgba(79, 195, 247, 0.9), 0 0 4px #fff;
        }
        .dust {
            width: 6px;
            height: 6px;
            background: #c0c8d0;
            opacity: 0.92;
            box-shadow: 0 0 6px rgba(200, 208, 216, 0.5);
        }
        .cloud {
            width: 28px;
            height: 28px;
            background: var(--cloud-color);
            filter: blur(6px);
            opacity: 0.95;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.8);
        }

        .control-area {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
        }

        .panel {
            background: var(--panel-bg);
            border-radius: 22px;
            padding: 28px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .panel-title {
            font-size: 19px;
            color: var(--text-primary);
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 500;
        }

        .param {
            margin-bottom: 20px;
        }
        .param-name {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            background: rgba(79, 195, 247, 0.15);
            border-radius: 999px;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--main-color);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(79, 195, 247, 0.7);
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 0 14px rgba(79, 195, 247, 1);
        }

        .btn-wrap {
            display: flex;
            gap: 16px;
            margin-top: 10px;
        }
        .btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            color: #fff;
        }
        .btn-start {
            background: linear-gradient(135deg, #26a69a, #4db6ac);
            box-shadow: 0 4px 14px rgba(38, 166, 166, 0.35);
        }
        .btn-reset {
            background: linear-gradient(135deg, #ef5350, #ff7043);
            box-shadow: 0 4px 14px rgba(239, 83, 80, 0.35);
        }
        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }
        .btn:active {
            transform: translateY(0);
        }

        .data-info {
            display: flex;
            gap: 16px;
            margin-top: 20px;
        }
        .data-item {
            flex: 1;
            text-align: center;
            padding: 14px 8px;
            background: rgba(79, 195, 247, 0.1);
            border-radius: 16px;
            border: 1px solid rgba(79, 195, 247, 0.25);
            box-shadow: inset 0 0 8px rgba(79, 195, 247, 0.05);
        }
        .data-num {
            font-size: 20px;
            color: var(--main-color);
            font-weight: 600;
        }
        .data-text {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        .chart-box {
            width: 100%;
            height: 200px;
            background: linear-gradient(145deg, #101828, #0c1322);
            border-radius: 18px;
            margin-top: 16px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.3);
        }
        #trendCanvas {
            width: 100%;
            height: 100%;
        }

        .explain {
            line-height: 1.8;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .robot-icon {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--main-color), var(--main-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            box-shadow: 0 4px 15px rgba(79, 195, 247, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
            user-select: none;
        }
        .robot-icon:active { cursor: grabbing; }
        .robot-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(79, 195, 247, 0.6);
        }
        .robot-icon::after { content: "🤖"; font-size: 30px; }

        .chat-window {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 340px;
            height: 450px;
            background: var(--panel-bg);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
            user-select: none;
        }
        .chat-header {
            padding: 16px 20px;
            background: rgba(79, 195, 247, 0.1);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
        }
        .chat-header:active { cursor: grabbing; }
        .chat-header h4 { color: var(--text-primary); font-size: 16px; font-weight: 500; }
        .chat-close {
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .chat-close:hover { color: #fff; }

        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; }
        .chat-message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            max-width: 85%;
        }
        .user-message {
            background: rgba(79, 195, 247, 0.2);
            color: var(--text-primary);
            margin-left: auto;
        }
        .ai-message {
            background: rgba(255,255,255,0.08);
            color: var(--text-secondary);
            margin-right: auto;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 16px;
            border-top: 1px solid var(--border-color);
        }
        #chatInput {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            user-select: text;
        }
        #sendBtn {
            padding: 12px 20px;
            background: var(--main-color);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #sendBtn:hover { background: var(--main-light); }
    </style>
</head>
<body>

<div class="container">
    <div class="view-box">
        <div class="sim-cabin" id="cabin"></div>
        <div class="legend">
            <div class="legend-item"><div class="water"></div><span>水蒸气</span></div>
            <div class="legend-item"><div class="dust"></div><span>凝结核</span></div>
            <div class="legend-item"><div class="cloud"></div><span>云团</span></div>
        </div>
    </div>

    <div class="control-area">
        <div class="panel">
            <h3 class="panel-title">参数控制</h3>
            <div class="param">
                <div class="param-name"><span>水蒸气密度</span><span id="waterVal">40</span></div>
                <input type="range" id="waterSlider" min="10" max="80" value="40">
            </div>
            <div class="param">
                <div class="param-name"><span>凝结核浓度</span><span id="dustVal">18</span></div>
                <input type="range" id="dustSlider" min="5" max="40" value="18">
            </div>
            <div class="param">
                <div class="param-name"><span>环境温度</span><span id="tempVal">0</span>℃</div>
                <input type="range" id="tempSlider" min="-20" max="20" value="0">
            </div>
            <div class="param">
                <div class="param-name"><span>空气流速</span><span id="windVal">45</span></div>
                <input type="range" id="windSlider" min="10" max="100" value="45">
            </div>
            <div class="btn-wrap">
                <button class="btn btn-start" id="startBtn">启动仿真</button>
                <button class="btn btn-reset" id="resetBtn">重置</button>
            </div>
            <div class="data-info">
                <div class="data-item">
                    <div class="data-num" id="cloudTotal">0</div>
                    <div class="data-text">云团数量</div>
                </div>
                <div class="data-item">
                    <div class="data-num" id="statusText">待机</div>
                </div>
            </div>
            <div class="chart-box"><canvas id="trendCanvas"></canvas></div>
        </div>

        <div class="panel">
            <h3 class="panel-title">原理解读</h3>
            <div class="explain" id="explainText">
                待机状态<br>
                零上温度：水汽难液化，几乎无云<br>
                零下温度：水汽依附凝结核形成云<br>
                风速越大，粒子运动越快、云越易被吹散
            </div>
        </div>
    </div>
</div>

<div class="robot-icon" id="robotIcon"></div>
<div class="chat-window" id="chatWindow">
    <div class="chat-header" id="chatHeader">
        <h4>💬 云仿真助手</h4>
        <span class="chat-close" id="chatClose">×</span>
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="chat-message ai-message">你好！我是智能AI助手，有什么问题都可以问我～</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="输入你的问题...">
        <button id="sendBtn">发送</button>
    </div>
</div>

<script>
    const cabin = document.getElementById('cabin');
    const waterSlider = document.getElementById('waterSlider');
    const dustSlider = document.getElementById('dustSlider');
    const tempSlider = document.getElementById('tempSlider');
    const windSlider = document.getElementById('windSlider');
    const waterVal = document.getElementById('waterVal');
    const dustVal = document.getElementById('dustVal');
    const tempVal = document.getElementById('tempVal');
    const windVal = document.getElementById('windVal');
    const cloudTotal = document.getElementById('cloudTotal');
    const statusText = document.getElementById('statusText');
    const explainText = document.getElementById('explainText');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const canvas = document.getElementById('trendCanvas');
    const ctx = canvas.getContext('2d');

    const robotIcon = document.getElementById('robotIcon');
    const chatWindow = document.getElementById('chatWindow');
    const chatClose = document.getElementById('chatClose');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatHeader = document.getElementById('chatHeader');

    const MAX_RECORD = 90;
    let recordList = [];
    let isRun = false;
    let waterCount = 40;
    let dustCount = 18;
    let nowTemp = 0;
    let windSpeed = 45;
    const baseWind = 45;

    let waterList = [];
    let dustList = [];
    let cloudList = [];
    const boxW = 560;
    const boxH = 420;

    window.addEventListener('resize', () => {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    });
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    function drawChart() {
        const w = canvas.width;
        const h = canvas.height;
        const pad = 30;
        ctx.clearRect(0,0,w,h);
        if (recordList.length < 2) return;
        let maxVal = Math.max(...recordList);
        let yMax = maxVal === 0 ? 10 : Math.ceil(maxVal/10)*10;
        ctx.strokeStyle = 'rgba(79,195,247,0.2)';
        ctx.fillStyle = '#b8c2cc';
        ctx.lineWidth = 1;
        const ySplit =5;
        for(let i=0;i<=ySplit;i++){
            let y = pad + (h-pad*2)*(1-i/ySplit);
            ctx.beginPath();
            ctx.moveTo(pad,y);
            ctx.lineTo(w-pad,y);
            ctx.stroke();
            ctx.font="11px Microsoft Yahei";
            ctx.fillText(String(Math.round(yMax*i/ySplit)),8,y+4);
        }
        const xSplit=8;
        for(let i=0;i<=xSplit;i++){
            let x=pad+(w-pad)*i/xSplit;
            ctx.beginPath();
            ctx.moveTo(x,pad);
            ctx.lineTo(x,h-pad);
            ctx.stroke();
        }
        ctx.strokeStyle='#4fc3f7';
        ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(pad,pad);
        ctx.lineTo(pad,h-pad);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(pad,h-pad);
        ctx.lineTo(w-pad,h-pad);
        ctx.stroke();
        ctx.fillStyle='#b8c2cc';
        ctx.font="12px Microsoft Yahei";
        ctx.fillText("云团数量",5,20);
        ctx.fillText("运行时序",w-60,h-8);
        ctx.beginPath();
        ctx.strokeStyle='#4fc3f7';
        ctx.lineWidth=2;
        for(let i=0;i<recordList.length;i++){
            let x=pad+(w-pad*2)*i/(MAX_RECORD-1);
            let ratio=recordList[i]/yMax;
            let y=pad+(h-pad*2)*(1-ratio);
            y=Math.max(pad,Math.min(h-pad,y));
            i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
        }
        ctx.stroke();
    }

    function createParticle(type,sp){
        const el=document.createElement('div');
        if(type==='water'){el.className='particle water';}
        else{el.className='particle dust';}
        el.style.left=Math.random()*(boxW-30)+'px';
        el.style.top=Math.random()*(boxH-30)+'px';
        el.vx=(Math.random()-0.5)*sp;
        el.vy=(Math.random()-0.5)*sp;
        cabin.appendChild(el);
        return el;
    }

    function initAll(){
        cabin.innerHTML='';
        waterList=[];dustList=[];cloudList=[];recordList=[];
        const wSp=1.2*(windSpeed/baseWind);
        const dSp=0.8*(windSpeed/baseWind);
        for(let i=0;i<waterCount;i++) waterList.push(createParticle('water',wSp));
        for(let i=0;i<dustCount;i++) dustList.push(createParticle('dust',dSp));
        isRun=false;statusText.innerText="待机";cloudTotal.innerText="0";
        explainText.innerHTML=`待机状态<br/>
零上温度：水汽难液化，几乎无云<br/>
零下温度：水汽依附凝结核形成云<br/>
风速越大，粒子运动越快、云越易被吹散`;
        drawChart();
    }

    function adjustWater(targetNum){
        const diff=targetNum-waterList.length;
        const sp=1.2*(windSpeed/baseWind);
        if(diff>0){for(let i=0;i<diff;i++) waterList.push(createParticle('water',sp));}
        else if(diff<0){for(let i=0;i<Math.abs(diff);i++){const p=waterList.pop();if(p)p.remove();}}
    }

    function adjustDust(targetNum){
        const diff=targetNum-dustList.length;
        const sp=0.8*(windSpeed/baseWind);
        if(diff>0){for(let i=0;i<diff;i++) dustList.push(createParticle('dust',sp));}
        else if(diff<0){for(let i=0;i<Math.abs(diff);i++){const p=dustList.pop();if(p)p.remove();}}
    }

    function updateAllSpeed(ratio){
        waterList.forEach(p=>{p.vx*=ratio;p.vy*=ratio;});
        dustList.forEach(p=>{p.vx*=ratio;p.vy*=ratio;});
        cloudList.forEach(p=>{p.vx*=ratio;p.vy*=ratio;});
    }

    function moveList(list){
        list.forEach(el=>{
            let x=parseFloat(el.style.left);
            let y=parseFloat(el.style.top);
            x+=el.vx;y+=el.vy;
            if(x<=0||x>=boxW-30)el.vx*=-1;
            if(y<=0||y>=boxH-30)el.vy*=-1;
            el.style.left=x+'px';
            el.style.top=y+'px';
        });
    }

    function refreshTip(){
        if(!isRun)return;
        if(nowTemp>0){explainText.innerText=`当前 ${nowTemp}℃（零上）：水汽无法液化，基本无云`;}
        else if(nowTemp===0){explainText.innerText=`当前 0℃（临界）：仅少量水汽凝结`;}
        else{explainText.innerText=`当前 ${nowTemp}℃（零下）：水汽液化成云，温度越低云越多`;}
    }

    function updateCloud(){
        let target=0;
        if(nowTemp<0){
            let cold=Math.abs(nowTemp);
            target=cold*1.5;
            target+=(waterCount-40)*0.15;
            target+=(dustCount-18)*0.2;
            target-=(windSpeed-45)*0.3;
            target=Math.max(0,Math.floor(target));
        }
        const diff=cloudList.length-target;
        if(diff>0){cloudList.pop().remove();}
        else if(diff<0){
            const idx=Math.floor(Math.random()*waterList.length);
            const cloud=document.createElement('div');
            cloud.className='particle cloud';
            cloud.style.left=waterList[idx].style.left;
            cloud.style.top=waterList[idx].style.top;
            cloud.vx=(Math.random()-0.5)*(windSpeed/80);
            cloud.vy=(Math.random()-0.5)*(windSpeed/80)-0.12;
            cabin.appendChild(cloud);
            cloudList.push(cloud);
        }
        cloudTotal.innerText=cloudList.length;
    }

    function loop(){
        if(isRun){
            moveList(waterList);moveList(dustList);moveList(cloudList);
            updateCloud();recordList.push(cloudList.length);
            if(recordList.length>MAX_RECORD)recordList.shift();
            drawChart();
        }
        requestAnimationFrame(loop);
    }

    waterSlider.oninput=function(){waterCount=+this.value;waterVal.innerText=waterCount;adjustWater(waterCount);};
    dustSlider.oninput=function(){dustCount=+this.value;dustVal.innerText=dustCount;adjustDust(dustCount);};
    tempSlider.oninput=function(){nowTemp=+this.value;tempVal.innerText=nowTemp;refreshTip();};
    windSlider.oninput=function(){const oldSpeed=windSpeed;windSpeed=+this.value;windVal.innerText=windSpeed;const ratio=windSpeed/oldSpeed;updateAllSpeed(ratio);};
    startBtn.onclick=function(){isRun=true;statusText.innerText="运行中";refreshTip();};
    resetBtn.onclick=function(){initAll();};

    let robotDrag=false;let robotOffsetX,robotOffsetY;
    robotIcon.addEventListener('mousedown',e=>{
        robotDrag=true;robotOffsetX=e.clientX-robotIcon.offsetLeft;robotOffsetY=e.clientY-robotIcon.offsetTop;
        robotIcon.style.right='auto';robotIcon.style.bottom='auto';
    });
    let chatDrag=false;let chatOffsetX,chatOffsetY;
    chatHeader.addEventListener('mousedown',e=>{
        chatDrag=true;chatOffsetX=e.clientX-chatWindow.offsetLeft;chatOffsetY=e.clientY-chatWindow.offsetTop;
        chatWindow.style.right='auto';chatWindow.style.bottom='auto';
    });
    document.addEventListener('mousemove',e=>{
        const winW=document.documentElement.clientWidth;const winH=document.documentElement.clientHeight;
        if(robotDrag){
            let x=e.clientX-robotOffsetX;let y=e.clientY-robotOffsetY;
            x=Math.max(0,Math.min(x,winW-robotIcon.offsetWidth));
            y=Math.max(0,Math.min(y,winH-robotIcon.offsetHeight));
            robotIcon.style.left=x+'px';robotIcon.style.top=y+'px';
        }
        if(chatDrag){
            let x=e.clientX-chatOffsetX;let y=e.clientY-chatOffsetY;
            x=Math.max(0,Math.min(x,winW-chatWindow.offsetWidth));
            y=Math.max(0,Math.min(y,winH-chatWindow.offsetHeight));
            chatWindow.style.left=x+'px';chatWindow.style.top=y+'px';
        }
    });
    document.addEventListener('mouseup',()=>{robotDrag=false;chatDrag=false;});
    robotIcon.addEventListener('click',()=>{if(robotDrag)return;chatWindow.style.display=chatWindow.style.display==='flex'?'none':'flex';});
    chatClose.addEventListener('click',()=>{chatWindow.style.display='none';});

    // ====================== 真实 AI 聊天 ======================
    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        const userMsg = document.createElement('div');
        userMsg.className = 'chat-message user-message';
        userMsg.textContent = text;
        chatMessages.appendChild(userMsg);
        chatInput.value = '';
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // ==============================================
        // 【唯一需要你填写的地方】把你的硅基密钥填在这里！
        // ==============================================
        const API_KEY = "sk-wykzbkntcbwobqtnvnbxqqkzqduqlijfzyyotimduixptghe";
        // ==============================================

        const apiUrl = "https://api.siliconflow.cn/v1/chat/completions";

        try {
            const res = await fetch(apiUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: "Qwen2.5-7B-Instruct",
                    messages: [
                        { role: "system", content: "你是全能智能AI助手，回答所有问题，语言简洁友好。" },
                        { role: "user", content: text }
                    ],
                    temperature: 0.6,
                    stream: false
                })
            });
            const data = await res.json();
            const reply = data.choices[0].message.content;
            const aiMsg = document.createElement('div');
            aiMsg.className = 'chat-message ai-message';
            aiMsg.textContent = reply;
            chatMessages.appendChild(aiMsg);
        } catch (e) {
            const aiMsg = document.createElement('div');
            aiMsg.className = 'chat-message ai-message';
            aiMsg.textContent = "网络异常，请检查密钥或网络";
            chatMessages.appendChild(aiMsg);
        }
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', e => {
        if (e.key === 'Enter') sendMessage();
    });

    initAll();
    loop();
</script>
